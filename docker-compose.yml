services:
  app:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - src/.env
    environment:
      - RATELIMIT_STORAGE_URI=redis://redis:6379/0
    volumes:
      - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro
      - ./src/uploads:/app/src/uploads
    depends_on:
      - redis

  redis:
    image: redis:7-alpine